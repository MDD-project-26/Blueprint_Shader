<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bluprint Models — Battery</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #perf-monitor {
    position: fixed;
    top: 1rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    color: rgba(255, 255, 255, 0.85);
    font-family: "Geist Mono", ui-monospace, monospace;
    font-size: 11px;
    line-height: 1.4;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    user-select: none;
  }
  #perf-monitor-text {
    white-space: pre;
  }
  #perf-history {
    display: block;
    width: 140px;
    height: 32px;
    margin-top: 6px;
  }
  #axis-gizmo {
    display: block;
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    z-index: 10;
    width: 84px;
    height: 84px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <!--
    Same tool as index.html (full control panel, same /main.js and
    /src/main.tsx). The only difference is data-battery="true" below:
    main.js reads that (as IS_BATTERY_ROUTE) to load the bundled NGEN
    battery with stacking switched on instead of the default scene.
  -->
  <canvas id="canvas" data-battery="true"></canvas>
  <div id="perf-monitor">
    <div id="perf-monitor-text"></div>
    <canvas height="32" id="perf-history" width="140"></canvas>
  </div>
  <canvas height="84" id="axis-gizmo" width="84"></canvas>
  <div id="react-controls-root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script type="module" src="/main.js"></script>
</body>
</html>
